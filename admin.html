<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Logo.png">
    <title>Data Management - LAP I.T. Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="backend/config.js"></script>
    <style>
        /* Tab nav */
        .tab-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
            width: 100%;
        }
        .tab {
            flex: 1;
            padding: 7px 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #718096;
            transition: all 0.2s;
            white-space: nowrap;
            border-radius: 8px;
            text-align: center;
        }
        .tab:hover { color: #0a57b0; background: #e8f1fc; }
        .tab.active {
            color: #fff;
            background: #0a57b0;
        }

        /* Loading animation */
        .loading { text-align: center; padding: 60px 20px; color: #718096; font-size: 16px; }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Fade in for tab content */
        #tab-content-container {
            animation: fadeIn 0.3s ease-in;
            padding: 28px 32px 40px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            #tab-content-container { padding: 16px 16px 32px; }
            .tab { padding: 6px 13px; font-size: 13px; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header — matches index.html -->
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 md:px-6 py-3 md:py-4">
            <!-- Mobile header -->
            <div class="flex items-center justify-between md:hidden">
                <button onclick="goBack()" title="Back to Home" style="width:36px;height:36px;border-radius:50%;background:#0a57b0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s;" onmouseover="this.style.background='#1a68c4'" onmouseout="this.style.background='#0a57b0'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <img src="LOGO1.png" alt="LAP I.T. Solutions" class="h-10 w-10 object-contain">
                <div class="text-right">
                    <p id="header-date-mobile" class="text-xs font-semibold text-gray-700"></p>
                    <p id="header-time-mobile" class="text-sm font-bold text-blue-900"></p>
                </div>
            </div>
            <!-- Desktop header -->
            <div class="hidden md:flex items-center justify-between">
                <button onclick="goBack()" title="Back to Home" style="width:40px;height:40px;border-radius:50%;background:#0a57b0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s;" onmouseover="this.style.background='#1a68c4'" onmouseout="this.style.background='#0a57b0'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="flex items-center gap-4">
                    <img src="LOGO1.png" alt="LAP I.T. Solutions" class="h-16 w-16 object-contain flex-shrink-0">
                    <div>
                        <h1 class="text-2xl font-bold text-blue-900">Data Management</h1>
                    </div>
                </div>
                <div class="text-center">
                    <p id="header-date" class="text-sm font-semibold text-gray-700"></p>
                    <p id="header-time" class="text-xl font-bold text-blue-900"></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Tab navigation -->
    <div class="bg-white border-b border-gray-100 shadow-sm">
        <div class="container mx-auto px-4 md:px-6">
            <div class="tab-bar">
                <button class="tab active" onclick="switchTab('products', 'admin/products.html')">Products</button>
                <button class="tab" onclick="switchTab('pos', 'admin/pospackages.html')">POS Packages</button>
                <button class="tab" onclick="switchTab('employees', 'admin/employees.html')">Employees</button>
            </div>
        </div>
    </div>

    <!-- Tab content -->
    <div class="px-4 md:px-8 py-6">
        <div class="max-w-screen-xl mx-auto bg-white rounded-2xl shadow-sm overflow-hidden">
            <div id="tab-content-container" style="min-height: 500px;">
                <div class="loading">Loading</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase
        let supabaseClient;
        if (window.lapSupabaseClient) {
            supabaseClient = window.lapSupabaseClient;
        } else {
            supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
            window.lapSupabaseClient = supabaseClient;
        }
        window.supabaseClient = supabaseClient;

        function goBack() {
            window.location.href = 'index.html';
        }

        let currentTab = 'products';

        async function switchTab(tabName, filePath) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            currentTab = tabName;
            await loadTabContent(filePath);
        }

        async function loadTabContent(filePath) {
            const container = document.getElementById('tab-content-container');
            try {
                container.innerHTML = '<div class="loading">Loading</div>';
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Failed to load ${filePath}`);
                const html = await response.text();
                container.innerHTML = html;
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.textContent));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#e53e3e;">
                        <h3 style="margin-bottom:10px;">⚠️ Error Loading Content</h3>
                        <p>Could not load ${filePath}</p>
                        <p style="font-size:14px;color:#718096;margin-top:10px;">${error.message}</p>
                    </div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTabContent('admin/products.html');
        });

        // Clock
        function updateClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const dateEl = document.getElementById('header-date');
            const timeEl = document.getElementById('header-time');
            const dateMEl = document.getElementById('header-date-mobile');
            const timeMEl = document.getElementById('header-time-mobile');
            if (dateEl) dateEl.textContent = dateStr;
            if (timeEl) timeEl.textContent = timeStr;
            if (dateMEl) dateMEl.textContent = dateStr;
            if (timeMEl) timeMEl.textContent = timeStr;
        }
        updateClock();
        setInterval(updateClock, 1000);

        function showMessage(elementId, message, isError = false) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${message}</div>`;
                setTimeout(() => el.innerHTML = '', 3000);
            }
        }
    </script>
</body>
</html>
