<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="backend/config.js"></script>
    <script src="backend/supabase.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Logo.png">
    <title>Quotations List - LAP I.T. Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --blue: #0a57b0;
            --blue-light: #e8f1fc;
            --blue-mid: #c5d8f0;
            --blue-dark: #0a3a80;
            --red: #e8192c;
        }

        body { font-family: 'Arial', sans-serif; background: #f3f4f6; min-height: 100vh; }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* ── Toolbar ── */
        .toolbar { display: flex; align-items: center; gap: 10px; }
        .toolbar-row2 { display: none; align-items: center; gap: 10px; margin-top: 10px; }

        /* Search bar */
        .search-bar {
            flex: 1;
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,87,176,0.1); }
        .search-bar-icon { padding: 0 10px 0 14px; color: #9ca3af; display: flex; align-items: center; flex-shrink: 0; }
        #searchInput {
            flex: 1; border: none; outline: none;
            font-size: 14px; color: #374151;
            padding: 10px 8px 10px 0; background: transparent;
        }

        /* Filter button */
        .filter-btn {
            display: flex; align-items: center; gap: 7px;
            padding: 9px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            font-size: 13px; font-weight: 700; color: #374151;
            cursor: pointer; flex-shrink: 0;
            transition: all 0.15s;
            letter-spacing: 0.04em;
        }
        .filter-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
        .filter-btn.has-filters { background: var(--blue); color: white; border-color: var(--blue); }
        .filter-btn.has-filters:hover { background: #1a68c4; }

        /* Filter panel */
        .filter-panel {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e5e7eb;
        }
        .filter-panel.open { display: block; }
        .filter-panel-label {
            font-size: 11px; font-weight: 700; color: #9ca3af;
            letter-spacing: 0.08em; margin-bottom: 10px;
        }
        .filter-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px; flex-wrap: wrap;
        }
        .filter-row select, .filter-row input[type="text"] {
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px; color: #374151;
            outline: none; background: white;
            transition: border-color 0.15s;
        }
        .filter-row select:focus, .filter-row input[type="text"]:focus {
            border-color: var(--blue); box-shadow: 0 0 0 2px rgba(10,87,176,0.1);
        }
        .filter-row .f-field { min-width: 130px; flex: 1; }
        .filter-row .f-op { min-width: 150px; flex: 1; }
        .filter-row .f-val { min-width: 160px; flex: 2; }
        .filter-row .f-remove {
            width: 32px; height: 32px; border-radius: 7px;
            background: #fee2e2; color: #dc3545; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700; flex-shrink: 0;
            transition: background 0.15s;
        }
        .filter-row .f-remove:hover { background: #fca5a5; }
        .add-filter-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; margin-top: 4px;
            border: 1.5px dashed #d1d5db; border-radius: 8px;
            background: transparent; color: #6b7280;
            font-size: 13px; font-weight: 700; cursor: pointer;
            transition: all 0.15s;
        }
        .add-filter-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

        /* View toggle */
        .view-toggle {
            display: flex;
            align-items: center;
            background: #f3f4f6;
            border-radius: 10px;
            padding: 4px;
            gap: 2px;
            flex-shrink: 0;
        }
        .view-btn {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .view-btn.active { background: var(--blue); color: white; box-shadow: 0 2px 6px rgba(10,87,176,0.3); }
        .view-btn:not(.active):hover { background: #e5e7eb; color: #6b7280; }

        /* ── List view (table) ── */
        .list-header-row th {
            background: var(--blue-light);
            color: var(--blue-dark);
            border-bottom: 1px solid var(--blue-mid);
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
        }
        .list-header-row th:last-child { text-align: right; }
        tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
            cursor: pointer;
        }
        tbody tr:hover { background: var(--blue-light); }
        tbody td { padding: 12px 14px; font-size: 13.5px; color: #374151; }
        tbody td:last-child { text-align: right; font-weight: 700; color: var(--red); }

        /* ── Card view ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            padding: 16px;
        }
        .q-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(10,87,176,0.08);
            border: 1.5px solid #e5e7eb;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            overflow: hidden;
        }
        .q-card:active { transform: scale(0.985); }
        .q-card:hover { box-shadow: 0 6px 20px rgba(10,87,176,0.13); border-color: var(--blue-mid); }
        .q-card-top {
            background: var(--blue-light);
            padding: 11px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .q-card-no { font-size: 14px; font-weight: 700; color: var(--blue-dark); }
        .q-card-date { font-size: 11px; color: #6b7280; background: white; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--blue-mid); }
        .q-card-body { padding: 11px 15px; display: grid; gap: 5px; }
        .q-card-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .q-card-label { color: #6b7280; font-weight: 600; font-size: 11.5px; }
        .q-card-value { color: #1f2937; font-weight: 500; text-align: right; max-width: 60%; word-break: break-word; }
        .q-card-amount { color: var(--red); font-weight: 700; font-size: 15px; }

        /* ── FAB ── */
        .fab {
            position: fixed; bottom: 28px; right: 28px;
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--blue); color: white; border: none;
            font-size: 28px; font-weight: 300; cursor: pointer;
            box-shadow: 0 4px 16px rgba(10,87,176,0.35);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
        }
        .fab:hover { background: #1a68c4; box-shadow: 0 6px 24px rgba(10,87,176,0.45); transform: scale(1.08); }

        /* ── Modal ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: 14px; width: 92%; max-width: 400px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-head { background: #dc3545; color: white; padding: 18px 20px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }
        .modal-body { padding: 24px 20px; font-size: 14px; color: #374151; text-align: center; }
        .modal-foot { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; }
        .modal-foot button { padding: 9px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn-cancel { background: #6b7280; color: white; } .btn-cancel:hover { background: #4b5563; }
        .btn-delete { background: #dc3545; color: white; } .btn-delete:hover { background: #b91c1c; }

        @media (max-width: 640px) {
            .toolbar { gap: 8px; }
            .toolbar-row2 { display: flex; }
            .toolbar .filter-btn, .toolbar .view-toggle { display: none; }
            #searchInput { font-size: 13px; }
            .filter-btn { padding: 9px 14px; font-size: 12px; }
            .filter-row { gap: 6px; }
            .filter-row select, .filter-row input[type="text"] { font-size: 12px; padding: 7px 8px; }
            .filter-row .f-field, .filter-row .f-op { min-width: 0; flex: 1 1 calc(50% - 3px); }
            .filter-row .f-val { min-width: 0; flex: 1 1 100%; }
            tbody td { padding: 10px; font-size: 12.5px; }
            .list-header-row th { padding: 9px 10px; font-size: 12px; }
            .cards-grid { grid-template-columns: 1fr; padding: 12px; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 md:px-6 py-3 md:py-4">
            <!-- Mobile -->
            <div class="flex items-center justify-between md:hidden">
                <button onclick="goBack()" title="Back to Home" style="width:36px;height:36px;border-radius:50%;background:#0a57b0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s;" onmouseover="this.style.background='#1a68c4'" onmouseout="this.style.background='#0a57b0'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <img src="LOGO1.png" alt="LAP I.T. Solutions" class="h-10 w-10 object-contain">
                <div class="text-right">
                    <p id="header-date-mobile" class="text-xs font-semibold text-gray-700"></p>
                    <p id="header-time-mobile" class="text-sm font-bold text-blue-900"></p>
                </div>
            </div>
            <!-- Desktop -->
            <div class="hidden md:flex items-center justify-between">
                <button onclick="goBack()" title="Back to Home" style="width:40px;height:40px;border-radius:50%;background:#0a57b0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s;" onmouseover="this.style.background='#1a68c4'" onmouseout="this.style.background='#0a57b0'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="flex items-center gap-4">
                    <img src="LOGO1.png" alt="LAP I.T. Solutions" class="h-16 w-16 object-contain flex-shrink-0">
                    <div>
                        <h1 class="text-2xl font-bold text-blue-900">Quotations List</h1>
                    </div>
                </div>
                <div class="text-center">
                    <p id="header-date" class="text-sm font-semibold text-gray-700"></p>
                    <p id="header-time" class="text-xl font-bold text-blue-900"></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <div class="px-4 md:px-8 py-6">
        <div class="max-w-screen-xl mx-auto">

            <!-- Toolbar: search + filter + view toggle -->
            <div class="bg-white rounded-2xl shadow-sm px-5 py-4 mb-5">
                <div class="toolbar">
                    <!-- Search bar -->
                    <div class="search-bar">
                        <span class="search-bar-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </span>
                        <input type="text" id="searchInput" placeholder="Type to Search ...">
                    </div>

                    <!-- Filter button -->
                    <button class="filter-btn" id="filterToggleBtn" onclick="toggleFilterPanel()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18v2.5l-7 7V20l-4-2v-6.5L3 6.5V4z"/></svg>
                        FILTER
                    </button>

                    <!-- View toggle -->
                    <div class="view-toggle">
                        <button class="view-btn active" id="btn-card-view" onclick="setView('card')" title="Card view">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
                        </button>
                        <button class="view-btn" id="btn-list-view" onclick="setView('list')" title="List view">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Mobile row 2: filter + view toggle -->
                <div class="toolbar-row2">
                    <button class="filter-btn" id="filterToggleBtnMobile" onclick="toggleFilterPanel()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18v2.5l-7 7V20l-4-2v-6.5L3 6.5V4z"/></svg>
                        FILTER
                    </button>
                    <div class="view-toggle">
                        <button class="view-btn active" id="btn-card-view-m" onclick="setView('card')" title="Card view">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
                        </button>
                        <button class="view-btn" id="btn-list-view-m" onclick="setView('list')" title="List view">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Filter panel -->
                <div class="filter-panel" id="filterPanel">
                    <div class="filter-panel-label">FILTER</div>
                    <div id="filterRows"></div>
                    <button class="add-filter-btn" onclick="addFilterRow()">+ ADD A FILTER</button>
                </div>
            </div>

            <!-- Content -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">

                <!-- Card view -->
                <div id="view-cards">
                    <div id="cards-grid" class="cards-grid"></div>
                </div>

                <!-- List view -->
                <div id="view-list" style="display:none; overflow-x:auto;">
                    <table style="width:100%; border-collapse:collapse;">
                        <thead>
                            <tr class="list-header-row">
                                <th>Quotation No.</th>
                                <th>Date</th>
                                <th>Client</th>
                                <th>Employee</th>
                                <th>Package Type</th>
                                <th style="text-align:right;">Total Amount</th>
                            </tr>
                        </thead>
                        <tbody id="quotationsTableBody">
                            <tr><td colspan="6" style="text-align:center;padding:60px 20px;color:#9ca3af;" class="loading-dots">Loading</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Empty state -->
                <div id="emptyState" style="display:none;" class="text-center py-16 px-6">
                    <div style="font-size:64px;margin-bottom:16px;">📄</div>
                    <h3 class="text-xl font-bold text-gray-700 mb-2">No Quotations Found</h3>
                    <p class="text-gray-400 text-sm mb-6">Create your first quotation to get started</p>
                    <button onclick="createNewQuotation()" style="background:#0a57b0;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">+ New Quotation</button>
                </div>
            </div>

        </div>
    </div>

    <!-- FAB -->
    <button class="fab" onclick="createNewQuotation()" title="New Quotation">+</button>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-head">⚠️ Confirm Delete</div>
            <div class="modal-body">
                <p>Are you sure you want to delete this quotation?</p>
                <p style="color:#9ca3af;font-size:12px;margin-top:8px;">This action cannot be undone.</p>
            </div>
            <div class="modal-foot">
                <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-delete" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let quotations = [];
        let quotationToDelete = null;
        let currentView = 'card';
        let filterRowCount = 0;

        const FIELDS = [
            { value: 'quotation_no', label: 'Quotation No.' },
            { value: 'client_name',  label: 'Client' },
            { value: 'employee_name',label: 'Employee' },
            { value: 'package_type', label: 'Package Type' },
        ];

        function goBack() { window.location.href = 'index.html'; }
        function createNewQuotation() { window.location.href = 'quotation.html'; }

        function setView(v) {
            currentView = v;
            document.getElementById('view-cards').style.display = v === 'card' ? '' : 'none';
            document.getElementById('view-list').style.display = v === 'list' ? '' : 'none';
            ['btn-card-view','btn-card-view-m'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('active', v === 'card'); });
            ['btn-list-view','btn-list-view-m'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('active', v === 'list'); });
            displayQuotations();
        }

        function toggleFilterPanel() {
            const panel = document.getElementById('filterPanel');
            const isOpen = panel.classList.toggle('open');
            if (isOpen && document.getElementById('filterRows').children.length === 0) {
                addFilterRow();
            }
        }

        function addFilterRow() {
            const id = ++filterRowCount;
            const row = document.createElement('div');
            row.className = 'filter-row';
            row.dataset.rowId = id;
            row.innerHTML = `
                <select class="f-field" onchange="onFieldChange(${id})">
                    ${FIELDS.map(f => `<option value="${f.value}">${f.label}</option>`).join('')}
                </select>
                <input type="text" class="f-val" placeholder="text filter" oninput="displayQuotations()">
                <button class="f-remove" onclick="removeFilterRow(${id})" title="Remove">✕</button>
            `;
            document.getElementById('filterRows').appendChild(row);
        }

        function onFieldChange(id) { displayQuotations(); }

        function removeFilterRow(id) {
            const row = document.querySelector(`.filter-row[data-row-id="${id}"]`);
            if (row) row.remove();
            updateFilterBtnState();
            displayQuotations();
        }

        function updateFilterBtnState() {
            const rows = document.querySelectorAll('.filter-row');
            const hasActive = Array.from(rows).some(r => r.querySelector('.f-val').value.trim() !== '');
            ['filterToggleBtn','filterToggleBtnMobile'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('has-filters', hasActive); });
        }

        function applyFilterRow(q, row) {
            const field = row.querySelector('.f-field').value;
            const val   = row.querySelector('.f-val').value.trim().toLowerCase();
            if (!val) return true;
            const cell = (q[field] || '').toString().toLowerCase();
            return cell.includes(val);
        }

        async function loadQuotations() {
            try {
                const { data, error } = await supabaseClient
                    .from('quotations')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) { showError('Failed to load quotations'); return; }
                quotations = data || [];
                displayQuotations();
            } catch (e) { showError('An error occurred while loading quotations'); }
        }

        function getFiltered() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filterRows = document.querySelectorAll('.filter-row');

            return quotations.filter(q => {
                // Search
                if (search) {
                    const match = (q.quotation_no && q.quotation_no.toLowerCase().includes(search)) ||
                                  (q.client_name && q.client_name.toLowerCase().includes(search)) ||
                                  (q.employee_name && q.employee_name.toLowerCase().includes(search));
                    if (!match) return false;
                }
                // Filter rows (all must pass)
                for (const row of filterRows) {
                    if (!applyFilterRow(q, row)) return false;
                }
                return true;
            });
        }

        function displayQuotations() {
            updateFilterBtnState();
            const tbody = document.getElementById('quotationsTableBody');
            const cardsGrid = document.getElementById('cards-grid');
            const emptyState = document.getElementById('emptyState');
            const viewCards = document.getElementById('view-cards');
            const viewList = document.getElementById('view-list');

            if (quotations.length === 0) {
                viewCards.style.display = 'none';
                viewList.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            const filtered = getFiltered();
            emptyState.style.display = 'none';

            if (currentView === 'card') {
                viewCards.style.display = '';
                viewList.style.display = 'none';
            } else {
                viewCards.style.display = 'none';
                viewList.style.display = '';
            }

            if (filtered.length === 0) {
                const noMatch = '<p style="text-align:center;color:#9ca3af;padding:40px 20px;font-size:14px;">No quotations match your filters.</p>';
                cardsGrid.innerHTML = noMatch;
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#9ca3af;">No quotations match your filters.</td></tr>';
                return;
            }

            // Cards
            cardsGrid.innerHTML = filtered.map(q => `
                <div class="q-card" onclick="viewQuotation('${q.id}')">
                    <div class="q-card-top">
                        <span class="q-card-no">${q.quotation_no || 'N/A'}</span>
                        <span class="q-card-date">${formatDate(q.quotation_date || q.created_at)}</span>
                    </div>
                    <div class="q-card-body">
                        <div class="q-card-row">
                            <span class="q-card-label">Client</span>
                            <span class="q-card-value" style="font-weight:700;color:#1e3a5f;">${q.client_name || '-'}</span>
                        </div>
                        <div class="q-card-row">
                            <span class="q-card-label">Employee</span>
                            <span class="q-card-value">${q.employee_name || '-'}</span>
                        </div>
                        <div class="q-card-row">
                            <span class="q-card-label">Package</span>
                            <span class="q-card-value">${q.package_type || '-'}</span>
                        </div>
                        <div class="q-card-row" style="margin-top:4px;padding-top:7px;border-top:1px solid #f0f0f0;">
                            <span class="q-card-label">Total</span>
                            <span class="q-card-amount">₱${formatAmount(q.total || 0)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            // List rows
            tbody.innerHTML = filtered.map(q => `
                <tr onclick="viewQuotation('${q.id}')">
                    <td><strong>${q.quotation_no || 'N/A'}</strong></td>
                    <td>${formatDate(q.quotation_date || q.created_at)}</td>
                    <td>${q.client_name || '-'}</td>
                    <td>${q.employee_name || '-'}</td>
                    <td>${q.package_type || '-'}</td>
                    <td>₱${formatAmount(q.total || 0)}</td>
                </tr>
            `).join('');
        }

        function viewQuotation(id) {
            const quotation = quotations.find(q => q.id === id);
            if (!quotation) { alert('Quotation not found'); return; }
            localStorage.setItem('viewQuotationData', JSON.stringify(quotation));
            localStorage.setItem('viewMode', 'true');
            window.location.href = 'quotation.html';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            quotationToDelete = null;
        }

        async function confirmDelete() {
            if (!quotationToDelete) return;
            try {
                const { error } = await supabaseClient.from('quotations').delete().eq('id', quotationToDelete);
                if (error) { alert('Failed to delete quotation'); return; }
                await loadQuotations();
                closeDeleteModal();
            } catch (e) { alert('An error occurred while deleting quotation'); }
        }

        window.onclick = function(e) {
            if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            return new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatAmount(amount) {
            return parseFloat(amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function showError(message) {
            document.getElementById('quotationsTableBody').innerHTML =
                `<tr><td colspan="6" style="text-align:center;padding:40px;color:#dc3545;">⚠️ ${message}</td></tr>`;
            document.getElementById('cards-grid').innerHTML =
                `<p style="text-align:center;color:#dc3545;padding:40px 20px;font-size:14px;">⚠️ ${message}</p>`;
        }

        // Clock
        function updateClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const d = document.getElementById('header-date'); if (d) d.textContent = dateStr;
            const t = document.getElementById('header-time'); if (t) t.textContent = timeStr;
            const dm = document.getElementById('header-date-mobile'); if (dm) dm.textContent = dateStr;
            const tm = document.getElementById('header-time-mobile'); if (tm) tm.textContent = timeStr;
        }
        updateClock();
        setInterval(updateClock, 1000);

        document.getElementById('searchInput').addEventListener('input', displayQuotations);
        document.addEventListener('DOMContentLoaded', loadQuotations);
    </script>
</body>
</html>
