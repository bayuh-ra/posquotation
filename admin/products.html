<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #0a57b0;
      --purple-light: #e8f1fc;
      --purple-mid: #1a68c4;
      --text-primary: #1a1a2e;
      --text-secondary: #6b7280;
      --price-color: #e8192c;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(10,87,176,0.07);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text-primary);
      padding-bottom: 40px;
    }

    .page-layout { display: block; }
    .products-section { width: 100%; }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .page-title h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.3px; }
    .page-title p  { font-size: 0.85rem; color: var(--text-secondary); margin-top: 3px; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 28px; right: 28px;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--purple); color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(10,87,176,0.45);
      z-index: 100;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .fab:hover { background: var(--purple-mid); transform: translateY(-2px); box-shadow: 0 6px 28px rgba(10,87,176,0.55); }
    .fab:active { transform: translateY(0); }
    .fab svg { width: 24px; height: 24px; }

    /* ── View toggle ── */
    .view-toggle {
      display: flex;
      background: #dde3ec;
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .view-toggle button {
      border: none;
      background: transparent;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .view-toggle button.active { background: var(--purple); color: #fff; }
    .view-toggle button svg { width: 16px; height: 16px; }

    /* ── Filter bar ── */
    .filter-card {
      background: white; border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 14px 16px; display: flex; gap: 12px;
      margin-bottom: 20px; flex-wrap: wrap;
    }

    .search-wrap {
      display: flex; align-items: center; gap: 8px;
      flex: 1; min-width: 180px;
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: 9px 13px; transition: border-color 0.15s;
    }
    .search-wrap:focus-within { border-color: var(--purple); }
    .search-wrap svg { width: 15px; height: 15px; color: var(--text-secondary); flex-shrink: 0; }
    .search-wrap input { border: none; outline: none; font-size: 0.9rem; width: 100%; font-family: inherit; color: var(--text-primary); }

    .filter-card select {
      padding: 9px 13px; border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 0.88rem; font-family: inherit; color: var(--text-primary);
      outline: none; cursor: pointer; transition: border-color 0.15s; background: white;
    }
    .filter-card select:focus { border-color: var(--purple); }

    /* ── Products grid ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    /* ── Product card ── */
    .prod-card {
      background: white;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94), background 0.15s;
    }

    .prod-card-swipe:hover .prod-card { background: #fafafe; }
    .prod-card-swipe.revealed .prod-card { transform: translateX(-70px); }
    .prod-card-swipe.selected { border-color: var(--purple); box-shadow: 0 0 0 2.5px var(--purple); }
    .prod-card-swipe.selected .prod-card { background: var(--purple-light) !important; }
    .prod-card-swipe.selected .card-top { background: #cfe0f8 !important; }
    .prod-card-swipe.selected .card-body { background: var(--purple-light); }
    .prod-swipe-wrapper.selected .prod-list-row { background: var(--purple-light) !important; border-left: 3px solid var(--purple); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card-top {
      background: var(--purple-light);
      padding: 16px 16px 12px;
      position: relative;
    }

    .card-product-name {
      font-size: 0.97rem;
      font-weight: 700;
      color: #0a3a80;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      padding-right: 30px;
    }

    .category-badge {
      display: inline-block;
      background: #e8f1fc;
      color: #0a57b0;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 8px;
    }

    /* ── Card swipe wrapper ── */
    .prod-card-swipe {
      position: relative; overflow: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid var(--border);
      animation: fadeUp 0.25s ease both;
      user-select: none; -webkit-user-select: none;
    }

    .prod-card-swipe:nth-child(1) { animation-delay: 0.05s; }
    .prod-card-swipe:nth-child(2) { animation-delay: 0.10s; }
    .prod-card-swipe:nth-child(3) { animation-delay: 0.15s; }
    .prod-card-swipe:nth-child(4) { animation-delay: 0.20s; }
    .prod-card-swipe:nth-child(5) { animation-delay: 0.25s; }
    .prod-card-swipe:nth-child(n+6) { animation-delay: 0.30s; }

    .prod-card-swipe-actions {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 70px; display: flex;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .prod-card-swipe.revealed .prod-card-swipe-actions { transform: translateX(0); }

    .prod-card-del-btn {
      flex: 1; border: none; background: #e53e3e; color: #fff; cursor: pointer;
      font-size: 0.75rem; font-weight: 700;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-family: inherit;
    }
    .prod-card-del-btn svg { width: 15px; height: 15px; }

    .card-body {
      padding: 12px 16px 14px;
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .card-meta-row:last-of-type { border-bottom: none; }

    .card-meta-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .card-meta-val { font-size: 0.88rem; color: var(--text-primary); font-weight: 500; text-align: right; }
    .card-meta-val.price { font-weight: 700; color: var(--price-color); }
    .card-meta-val.empty { color: #c4cad6; }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ── List view ── */
    .products-list-table {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .prod-list-header {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr 1.2fr;
      padding: 10px 20px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #0a3a80;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      background: var(--purple-light);
      border-bottom: 1px solid #c5d8f0;
    }

    @media (max-width: 640px) {
      .prod-list-header { grid-template-columns: 2fr 1.2fr; }
      .prod-list-header span:nth-child(2),
      .prod-list-header span:nth-child(3) { display: none; }
      .prod-list-row { grid-template-columns: 2fr 1.2fr; }
      .prod-list-row span:nth-child(2),
      .prod-list-row span:nth-child(3) { display: none; }
    }

    .prod-swipe-wrapper {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      user-select: none;
      -webkit-user-select: none;
    }

    .prod-swipe-wrapper:last-child { border-bottom: none; }

    .prod-list-row {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr 1.2fr; /* overridden on mobile by media query above */
      padding: 13px 20px;
      align-items: center;
      gap: 8px;
      background: white;
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
    }

    .prod-swipe-wrapper:hover .prod-list-row { background: #f9f8ff; }
    .prod-swipe-wrapper.revealed .prod-list-row { transform: translateX(-70px); }
    .prod-swipe-wrapper.selected .prod-list-row { background: var(--purple-light); }

    .list-cell-name { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-cat-badge { display: inline-block; background: #e8f1fc; color: #0a57b0; font-size: 0.72rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .list-cell-unit { font-size: 0.85rem; color: var(--text-secondary); }
    .list-cell-price { font-size: 0.9rem; font-weight: 700; color: var(--price-color); }
    .list-cell-dash { color: #c4cad6; }

    .prod-swipe-actions {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 70px;
      display: flex;
      z-index: 0;
    }

    .prod-del-swipe-btn {
      flex: 1;
      border: none;
      background: #e53e3e;
      color: #fff;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: inherit;
    }

    .prod-del-swipe-btn svg { width: 15px; height: 15px; }

    /* ── States ── */
    .loading-state, .empty-state { text-align: center; padding: 48px; color: var(--text-secondary); font-size: 0.9rem; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--purple-light); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Side panel ── */
    .side-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 380px;
      background: white; border-left: 1px solid var(--border);
      box-shadow: -4px 0 28px rgba(10,87,176,0.10);
      padding: 32px 28px; overflow-y: auto; z-index: 150;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
      display: block;
    }
    .side-panel.active { transform: translateX(0); }
    .side-panel h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; color: var(--text-primary); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .form-group > input, .form-group > select, .form-group > textarea { width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.15s; color: var(--text-primary); }
    .form-group > input:focus, .form-group > select:focus, .form-group > textarea:focus { border-color: var(--purple); }


    /* Description format toggle */
    .desc-format-toggle {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .desc-fmt-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 7px; border: 1.5px solid var(--border);
      background: white; font-size: 0.78rem; font-weight: 600;
      color: var(--text-secondary); cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .desc-fmt-btn svg { width: 13px; height: 13px; }
    .desc-fmt-btn.active { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }
    .desc-fmt-btn:hover:not(.active) { border-color: #b0b8c8; }
    .desc-textarea {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 0.9rem; font-family: inherit; outline: none;
      transition: border-color 0.15s; color: var(--text-primary);
      resize: vertical; min-height: 80px;
    }
    .desc-textarea:focus { border-color: var(--purple); }
    .panel-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .btn-cancel { background: var(--border); color: var(--text-secondary); border: none; border-radius: 9px; padding: 10px 20px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--purple); color: #fff; border: none; border-radius: 9px; padding: 10px 22px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.15s; flex: 1; }
    .btn-save:hover { background: var(--purple-mid); }

    /* ── Panel detail view ── */
    .panel-detail-header { background: var(--purple-light); border-radius: 10px; padding: 18px 16px; margin-bottom: 20px; }
    .panel-detail-name { font-size: 1.15rem; font-weight: 700; color: #0a3a80; line-height: 1.3; margin-bottom: 6px; }
    .panel-category-badge { display: inline-block; background: #e8f1fc; color: #0a57b0; font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .panel-detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .panel-detail-row:last-child { border-bottom: none; }
    .panel-detail-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-secondary); flex-shrink: 0; }
    .panel-detail-value { font-size: 0.9rem; color: var(--text-primary); text-align: right; word-break: break-word; }
    .panel-detail-value.price { font-weight: 700; color: var(--price-color); }
    .panel-detail-value.empty { color: #c4cad6; }
    .panel-detail-actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn-edit-detail { display: flex; align-items: center; gap: 7px; justify-content: center; flex: 1; background: var(--purple); color: #fff; border: none; border-radius: 10px; padding: 11px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.15s; font-family: inherit; }
    .btn-edit-detail:hover { background: var(--purple-mid); }
    .btn-delete-detail { display: flex; align-items: center; gap: 7px; justify-content: center; flex: 1; background: #fff; color: #e53e3e; border: 2px solid #e53e3e; border-radius: 10px; padding: 11px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; font-family: inherit; }
    .btn-delete-detail:hover { background: #e53e3e; color: #fff; }
    .btn-edit-detail svg, .btn-delete-detail svg { width: 14px; height: 14px; }

    /* ── Combo ── */
    .combo-wrap { position: relative; }

    .combo-field {
      display: flex; align-items: center;
      border: 1.5px solid var(--border); border-radius: 9px;
      padding: 0 13px; background: white;
      transition: border-color 0.15s; cursor: text;
    }
    .combo-field.open { border-color: var(--purple); }

    .combo-input {
      flex: 1; border: none; outline: none;
      font-size: 0.9rem; font-family: inherit;
      color: var(--text-primary); padding: 10px 0;
      background: transparent; width: 100%; min-width: 0;
    }

    /* Chevron SVG icon like a real select */
    .combo-chevron {
      flex-shrink: 0; margin-left: 6px; pointer-events: none;
      color: var(--text-secondary); display: flex; align-items: center;
    }
    .combo-chevron svg { width: 16px; height: 16px; }

    .combo-list {
      position: absolute;
      top: calc(100% + 4px); left: 0; right: 0;
      background: white;
      border: 1.5px solid var(--border); border-radius: 9px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 500; max-height: 220px;
      overflow-y: auto; overflow-x: hidden;
      display: none;
    }
    .combo-list.open { display: block; }

    .combo-add-row {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 14px; font-size: 0.88rem;
      color: var(--purple); font-weight: 600; cursor: pointer;
      border-bottom: 1px solid var(--border);
      background: white;
    }
    .combo-add-row:hover { background: var(--purple-light); }

    .combo-empty { padding: 10px 14px; font-size: 0.85rem; color: var(--text-secondary); }

    /* Each option row — swipeable */
    .combo-item-wrap {
      position: relative; overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .combo-item-wrap:last-child { border-bottom: none; }

    .combo-item {
      padding: 10px 14px; font-size: 0.88rem;
      color: var(--text-primary); cursor: pointer;
      background: white; position: relative; z-index: 1;
      transition: transform 0.22s cubic-bezier(0.25,0.46,0.45,0.94);
      white-space: nowrap;
      user-select: none; -webkit-user-select: none;
    }
    .combo-item:hover { background: #fafafe; }
    .combo-item.selected-item { background: var(--purple-light); color: var(--purple); font-weight: 600; }

    /* Revealed = slid left to show delete */
    .combo-item-wrap.revealed .combo-item { transform: translateX(-72px); }

    .combo-del-btn {
      position: absolute; right: 0; top: 0; bottom: 0; width: 72px;
      background: #e53e3e; color: white; border: none;
      font-size: 0.72rem; font-weight: 700; cursor: pointer; z-index: 0;
      font-family: inherit; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
    }
    .combo-del-btn svg { width: 14px; height: 14px; pointer-events: none; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: #1a1a2e; color: #fff;
      padding: 11px 18px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 500;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; z-index: 2000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .side-panel { width: 100%; border-left: none; padding: 24px 20px; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    }

    .panel-back-btn { display: none; }

    .panel-top-bar { display: flex; justify-content: flex-start; align-items: center; gap: 12px; margin-bottom: 16px; }
    .panel-top-title { flex: 1; text-align: right; font-size: 1.1rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .panel-close-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; background: #0a57b0;
      border: none; border-radius: 50%; cursor: pointer;
      color: #fff; transition: background 0.15s;
    }
    .panel-close-btn:hover { background: #1a68c4; }
    .panel-close-btn svg { width: 16px; height: 16px; }

  </style>
</head>
<body>

<div class="page-layout">
  <div class="products-section">
    <div class="page-header">
      <div class="page-title">
        <h1>Products</h1>
        <p id="product-count">Loading…</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="view-toggle">
          <button class="active" id="prod-btn-grid" title="Card view" onclick="setProdView('grid')">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <rect x="1" y="1" width="6" height="6" rx="1.2"/>
              <rect x="9" y="1" width="6" height="6" rx="1.2"/>
              <rect x="1" y="9" width="6" height="6" rx="1.2"/>
              <rect x="9" y="9" width="6" height="6" rx="1.2"/>
            </svg>
          </button>
          <button id="prod-btn-list" title="List view" onclick="setProdView('list')">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <rect x="1" y="2" width="14" height="2.5" rx="1.2"/>
              <rect x="1" y="6.75" width="14" height="2.5" rx="1.2"/>
              <rect x="1" y="11.5" width="14" height="2.5" rx="1.2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="filter-card">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search products…" oninput="searchProducts()" />
      </div>
      <select id="category-filter" onchange="searchProducts()">
        <option value="">All Categories</option>
      </select>
    </div>

    <div id="products-container">
      <div class="loading-state"><div class="spinner"></div><p>Loading products…</p></div>
    </div>
  </div>

  <!-- Side panel -->
  <div class="side-panel" id="side-panel">
    <div class="panel-top-bar">
      <button class="panel-close-btn" onclick="closePanel()" title="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="panel-top-title" id="panel-title"></span>
    </div>
    <button class="panel-back-btn" id="panel-back-btn" onclick="closePanel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to Products
    </button>

    <!-- Detail view -->
    <div id="panel-view" style="display:none">
      <div id="panel-detail-content"></div>
      <div class="panel-detail-actions">
        <button class="btn-edit-detail" onclick="switchToEdit()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit
        </button>
        <button class="btn-delete-detail" onclick="deleteProductFromPanel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Delete
        </button>
      </div>
    </div>

    <!-- Add / Edit form -->
    <div id="panel-form" style="display:none">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="input-name" placeholder="e.g. Cash Drawer" />
      </div>

      <div class="form-group">
        <label>Category</label>
        <!-- combo rendered by JS -->
        <div id="combo-category"></div>
      </div>

      <div class="form-group">
        <label>Unit</label>
        <div id="combo-unit"></div>
      </div>

      <div class="form-group">
        <label>Base Price (₱)</label>
        <input type="number" id="input-price" placeholder="e.g. 45000" min="0" step="0.01" />
      </div>

      <div class="form-group">
        <label>Description <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:0.75rem;color:#9ca3af">(optional)</span></label>
        <div class="desc-format-toggle">
          <button type="button" class="desc-fmt-btn active" id="desc-fmt-paragraph" onclick="setDescFormat('paragraph')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
            Paragraph
          </button>
          <button type="button" class="desc-fmt-btn" id="desc-fmt-bullet" onclick="setDescFormat('bullet')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
            Bullet List
          </button>
        </div>
        <textarea class="desc-textarea" id="input-desc" placeholder="Optional description..." rows="3"></textarea>
      </div>

      <div class="panel-actions">
        <button class="btn-cancel" onclick="cancelForm()">Cancel</button>
        <button class="btn-save" onclick="saveProduct()">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var supabase = window.supabaseClient || window.lapSupabaseClient;
  var allProducts = [];
  var categories = [];   // [{id, name}]
  var units = [];        // [{id, name}]
  var editingId = null;
  var viewingProduct = null;
  var descFormat = 'paragraph'; // 'paragraph' | 'bullet'
  var prodViewMode = 'grid';

  // ─── exposed globals ───────────────────────────────────────────────
  window.loadProducts = init;
  window.setDescFormat = setDescFormat;
  window.setProdView = setProdView;
  window.searchProducts = searchProducts;
  window.openAddProductPanel = openAddProductPanel;
  window.cancelForm = cancelForm;
  window.closePanel = closePanel;
  window.saveProduct = saveProduct;
  window.switchToEdit = switchToEdit;
  window.deleteProductFromPanel = deleteProductFromPanel;

  init();

  async function init() {
    await Promise.all([loadMeta(), loadProductsList()]);
  }

  // ─── meta (categories + units) ─────────────────────────────────────
  async function loadMeta() {
    var [catRes, unitRes] = await Promise.all([
      supabase.from('product_categories').select('id, name').order('name'),
      supabase.from('units').select('id, name').order('name')
    ]);
    categories = catRes.data || [];
    units      = unitRes.data || [];

    // Refresh the filter dropdown
    var catFilter = document.getElementById('category-filter');
    catFilter.innerHTML = '<option value="">All Categories</option>' +
      categories.map(function (c) { return '<option value="' + escHtml(c.name) + '">' + escHtml(c.name) + '</option>'; }).join('');

    // If combos are already mounted, refresh their lists
    refreshCombo('category');
    refreshCombo('unit');
  }

  // ─── products list ─────────────────────────────────────────────────
  async function loadProductsList() {
    document.getElementById('products-container').innerHTML =
      '<div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>';

    var result = await supabase.from('products')
      .select('id, name, category, unit, base_price, description')
      .order('name', { ascending: true });

    if (result.error) {
      document.getElementById('products-container').innerHTML =
        '<div class="loading-state">⚠️ ' + escHtml(result.error.message) + '</div>';
      return;
    }
    allProducts = result.data || [];
    renderProducts(allProducts);
  }

  function setProdView(mode) {
    prodViewMode = mode;
    document.getElementById('prod-btn-grid').classList.toggle('active', mode === 'grid');
    document.getElementById('prod-btn-list').classList.toggle('active', mode === 'list');
    renderProducts(allProducts.filter(function (p) {
      var q   = document.getElementById('search-input').value.toLowerCase();
      var cat = document.getElementById('category-filter').value;
      return (!q || p.name.toLowerCase().indexOf(q) !== -1) && (!cat || p.category === cat);
    }));
  }

  function renderProducts(list) {
    document.getElementById('product-count').textContent =
      list.length + ' product' + (list.length !== 1 ? 's' : '') + ' total';

    if (list.length === 0) {
      document.getElementById('products-container').innerHTML =
        '<div class="empty-state">No products found.</div>';
      return;
    }

    if (prodViewMode === 'list') {
      var rows = list.map(function (p) {
        var price = p.base_price != null
          ? '&#8369;' + parseFloat(p.base_price).toLocaleString('en-PH', { minimumFractionDigits: 2 })
          : '<span class="list-cell-dash">—</span>';
        var cat = p.category
          ? '<span class="list-cat-badge">' + escHtml(p.category) + '</span>'
          : '<span class="list-cell-dash">—</span>';
        var unit = p.unit ? escHtml(p.unit) : '<span class="list-cell-dash">—</span>';

        return '<div class="prod-swipe-wrapper" data-id="' + p.id + '">' +
          '<div class="prod-list-row">' +
            '<span class="list-cell-name">' + escHtml(p.name) + '</span>' +
            '<span>' + cat + '</span>' +
            '<span class="list-cell-unit">' + unit + '</span>' +
            '<span class="list-cell-price">' + price + '</span>' +
          '</div>' +
          '<div class="prod-swipe-actions">' +
            '<button class="prod-del-swipe-btn" data-id="' + p.id + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
              'Delete' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');

      document.getElementById('products-container').innerHTML =
        '<div class="products-list-table">' +
          '<div class="prod-list-header"><span>Product Name</span><span>Category</span><span>Unit</span><span>Price</span></div>' +
          rows +
        '</div>';

      attachListEvents();
      return;
    }

    var cards = list.map(function (p) {
      var price = p.base_price != null
        ? '&#8369;' + parseFloat(p.base_price).toLocaleString('en-PH', { minimumFractionDigits: 2 })
        : null;
      var desc = (p.description && p.description !== 'EMPTY') ? p.description : null;

      var inner =
        '<div class="card-top">' +
          '<div class="card-product-name">' + escHtml(p.name) + '</div>' +
          (p.category ? '<span class="category-badge">' + escHtml(p.category) + '</span>' : '') +
        '</div>' +
        '<div class="card-body">';

      if (p.unit) {
        inner += '<div class="card-meta-row"><span class="card-meta-label">Unit</span><span class="card-meta-val">' + escHtml(p.unit) + '</span></div>';
      }
      inner +=
        '<div class="card-meta-row">' +
          '<span class="card-meta-label">Price</span>' +
          '<span class="card-meta-val' + (price ? ' price' : ' empty') + '">' + (price || '—') + '</span>' +
        '</div>';
      if (desc) { inner += '<div class="card-desc">' + escHtml(desc) + '</div>'; }
      inner += '</div>';

      return '<div class="prod-card-swipe" data-id="' + p.id + '">' +
        '<div class="prod-card">' + inner + '</div>' +
        '<div class="prod-card-swipe-actions">' +
          '<button class="prod-card-del-btn" data-id="' + p.id + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
            'Delete' +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    document.getElementById('products-container').innerHTML =
      '<div class="products-grid">' + cards + '</div>';

    attachCardEvents();
  }

  function searchProducts() {
    var q   = document.getElementById('search-input').value.toLowerCase();
    var cat = document.getElementById('category-filter').value;
    renderProducts(allProducts.filter(function (p) {
      return (!q || p.name.toLowerCase().indexOf(q) !== -1) && (!cat || p.category === cat);
    }));
  }

  // ─── Product card events ───────────────────────────────────────────
  function closeAllSwipes() {
    document.querySelectorAll('.prod-swipe-wrapper.revealed').forEach(function (w) { w.classList.remove('revealed'); });
  }

  function attachCardEvents() {
    var revealed = null;

    document.querySelectorAll('.prod-card-swipe').forEach(function (wrapper) {
      var card = wrapper.querySelector('.prod-card');
      var delBtn = wrapper.querySelector('.prod-card-del-btn');
      var startX, startY, dragged = false;

      function onStart(x, y) { startX = x; startY = y; dragged = false; }
      function onMove(x, y) {
        if (Math.abs(y - startY) > Math.abs(x - startX)) return;
        var dx = x - startX;
        if (Math.abs(dx) > 8) dragged = true;
        if (dx < -20 && wrapper !== revealed) {
          if (revealed) revealed.classList.remove('revealed');
          wrapper.classList.add('revealed'); revealed = wrapper;
        } else if (dx > 20 && wrapper === revealed) {
          wrapper.classList.remove('revealed'); revealed = null;
        }
      }

      wrapper.addEventListener('touchstart', function (e) { onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      wrapper.addEventListener('touchmove',  function (e) { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      wrapper.addEventListener('mousedown',  function (e) { if (e.button !== 0) return; onStart(e.clientX, e.clientY); wrapper._md = true; });
      document.addEventListener('mousemove', function (e) { if (wrapper._md) onMove(e.clientX, e.clientY); });
      document.addEventListener('mouseup',   function (e) { if (wrapper._md) wrapper._md = false; });

      card.addEventListener('click', function (e) {
        if (dragged) { dragged = false; return; }
        if (wrapper.classList.contains('revealed')) { wrapper.classList.remove('revealed'); revealed = null; return; }
        var id = parseInt(wrapper.dataset.id);
        var p  = allProducts.find(function (x) { return x.id === id; });
        if (p) openDetailPanel(p);
      });

      if (delBtn) {
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          deleteProductById(parseInt(delBtn.dataset.id));
        });
      }
    });

    document.addEventListener('click', function (e) {
      if (revealed && !e.target.closest('.prod-card-swipe') && !e.target.closest('.side-panel')) {
        revealed.classList.remove('revealed'); revealed = null;
      }
    });
  }

  function attachListEvents() {
    var revealed = null;

    document.querySelectorAll('.prod-swipe-wrapper').forEach(function (wrapper) {
      var startX, startY, dragged = false;

      function onStart(x, y) { startX = x; startY = y; dragged = false; }
      function onMove(x, y) {
        if (Math.abs(y - startY) > Math.abs(x - startX)) return;
        if (Math.abs(x - startX) > 8) dragged = true;
        var dx = x - startX;
        if (dx < -20 && wrapper !== revealed) {
          if (revealed) revealed.classList.remove('revealed');
          wrapper.classList.add('revealed'); revealed = wrapper;
        } else if (dx > 20 && wrapper === revealed) {
          wrapper.classList.remove('revealed'); revealed = null;
        }
      }

      wrapper.addEventListener('touchstart', function (e) { onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      wrapper.addEventListener('touchmove',  function (e) { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

      wrapper.addEventListener('mousedown', function (e) { if (e.button !== 0) return; onStart(e.clientX, e.clientY); });
      document.addEventListener('mousemove', function (e) { if (startX !== undefined) onMove(e.clientX, e.clientY); });

      wrapper.addEventListener('click', function (e) {
        if (dragged) { dragged = false; return; }
        if (e.target.closest('.prod-swipe-actions')) return;
        if (wrapper.classList.contains('revealed')) { wrapper.classList.remove('revealed'); revealed = null; return; }
        var id = parseInt(wrapper.dataset.id);
        var p  = allProducts.find(function (x) { return x.id === id; });
        if (p) openDetailPanel(p);
      });

      var delBtn = wrapper.querySelector('.prod-del-swipe-btn');
      if (delBtn) {
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          deleteProductById(parseInt(delBtn.dataset.id));
        });
      }
    });

    document.addEventListener('click', function (e) {
      if (revealed && !e.target.closest('.prod-swipe-wrapper') && !e.target.closest('.side-panel')) {
        revealed.classList.remove('revealed'); revealed = null;
      }
    });
  }

  function setSelectedRow(id) {
    document.querySelectorAll('.prod-card-swipe.selected, .prod-swipe-wrapper.selected').forEach(function (el) { el.classList.remove('selected'); });
    if (id != null) {
      var el = document.querySelector('.prod-card-swipe[data-id="' + id + '"], .prod-swipe-wrapper[data-id="' + id + '"]');
      if (el) el.classList.add('selected');
    }
  }

  // ─── Panel: detail ─────────────────────────────────────────────────
  function openDetailPanel(p) {
    viewingProduct = p;
    setSelectedRow(p.id);
    var price = p.base_price != null
      ? '&#8369;' + parseFloat(p.base_price).toLocaleString('en-PH', { minimumFractionDigits: 2 })
      : null;
    var desc = (p.description && p.description !== 'EMPTY') ? p.description : null;

    document.getElementById('panel-detail-content').innerHTML =
      '<div class="panel-detail-header">' +
        '<div class="panel-detail-name">' + escHtml(p.name) + '</div>' +
        (p.category ? '<span class="panel-category-badge">' + escHtml(p.category) + '</span>' : '') +
      '</div>' +
      detailRow('Unit',        p.unit  ? escHtml(p.unit)  : null) +
      detailRow('Price',       price,                              'price') +
      detailRow('Description', desc    ? escHtml(desc)    : null);

    showSection('view');
    document.getElementById('side-panel').classList.add('active');
  }

  function detailRow(label, value, cls) {
    var valHtml = value != null
      ? '<span class="panel-detail-value ' + (cls || '') + '">' + value + '</span>'
      : '<span class="panel-detail-value empty">—</span>';
    return '<div class="panel-detail-row"><span class="panel-detail-label">' + label + '</span>' + valHtml + '</div>';
  }

  function switchToEdit() {
    if (!viewingProduct) return;
    editingId = viewingProduct.id;
    document.getElementById('panel-title').textContent = 'Edit Product';
    showSection('form');
    ensureCombos();
    document.getElementById('input-name').value  = viewingProduct.name || '';
    document.getElementById('input-price').value = viewingProduct.base_price != null ? viewingProduct.base_price : '';
    var existingDesc = (viewingProduct.description && viewingProduct.description !== 'EMPTY') ? viewingProduct.description : '';
    var detectedFmt = (existingDesc && (existingDesc.includes('•') || existingDesc.trimStart().startsWith('-'))) ? 'bullet' : 'paragraph';
    setDescFormat(detectedFmt);
    document.getElementById('input-desc').value  = existingDesc;
    setComboValue('category', viewingProduct.category || '');
    setComboValue('unit',     viewingProduct.unit     || '');
    document.getElementById('input-name').focus();
  }

  function setDescFormat(fmt) {
    descFormat = fmt;
    var pBtn = document.getElementById('desc-fmt-paragraph');
    var bBtn = document.getElementById('desc-fmt-bullet');
    if (!pBtn || !bBtn) return;
    pBtn.classList.toggle('active', fmt === 'paragraph');
    bBtn.classList.toggle('active', fmt === 'bullet');
    var ta = document.getElementById('input-desc');
    if (!ta) return;
    if (fmt === 'bullet') {
      ta.placeholder = '• Item one\n• Item two\n• Item three';
      ta.addEventListener('keydown', bulletKeyHandler);
      ta.addEventListener('focus', bulletFocusHandler);
    } else {
      ta.placeholder = 'Optional description...';
      ta.removeEventListener('keydown', bulletKeyHandler);
      ta.removeEventListener('focus', bulletFocusHandler);
    }
  }

  function bulletFocusHandler(e) {
    var ta = e.target;
    if (!ta.value) { ta.value = '• '; ta.selectionStart = ta.selectionEnd = 2; }
  }

  function bulletKeyHandler(e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var ta = e.target;
    var start = ta.selectionStart;
    var val = ta.value;
    var lineStart = val.lastIndexOf('\n', start - 1) + 1;
    var currentLine = val.substring(lineStart, start);
    // If current line starts with bullet, add bullet on new line
    if (currentLine.trimStart().startsWith('•') || currentLine.trimStart().startsWith('-')) {
      var insertion = '\n• ';
      ta.value = val.substring(0, start) + insertion + val.substring(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = start + insertion.length;
    } else {
      var ins = '\n';
      ta.value = val.substring(0, start) + ins + val.substring(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = start + ins.length;
    }
  }

  async function deleteProductFromPanel() {
    if (!viewingProduct) return;
    if (!confirm('Delete "' + viewingProduct.name + '"? This cannot be undone.')) return;
    var result = await supabase.from('products').delete().eq('id', viewingProduct.id);
    if (result.error) { showToast('Error: ' + result.error.message); return; }
    closePanel(); showToast('Product deleted.'); viewingProduct = null;
    await loadProductsList();
  }

  // ─── Panel: form ───────────────────────────────────────────────────
  function openAddProductPanel() {
    editingId = null; viewingProduct = null;
    document.getElementById('panel-title').textContent = 'Add Product';
    showSection('form');
    document.getElementById('side-panel').classList.add('active');
    ensureCombos();
    document.getElementById('input-name').value  = '';
    document.getElementById('input-price').value = '';
    document.getElementById('input-desc').value  = '';
    setComboValue('category', '');
    setComboValue('unit',     '');
    document.getElementById('input-name').focus();
  }

  function cancelForm() {
    if (editingId && viewingProduct) { showSection('view'); }
    else { closePanel(); }
  }

  function closePanel() {
    document.getElementById('side-panel').classList.remove('active');
    setSelectedRow(null);
    viewingProduct = null;
    editingId = null;
  }

  function showSection(which) {
    document.getElementById('panel-view').style.display = which === 'view' ? 'block' : 'none';
    document.getElementById('panel-form').style.display = which === 'form' ? 'block' : 'none';
    if (which === 'view') document.getElementById('panel-title').textContent = '';
  }

  async function saveProduct() {
    var name = document.getElementById('input-name').value.trim();
    if (!name) { showToast('Product name is required.'); return; }

    var body = {
      name:        name,
      category:    getComboValue('category') || null,
      unit:        getComboValue('unit')     || null,
      base_price:  document.getElementById('input-price').value !== ''
                     ? parseFloat(document.getElementById('input-price').value) : null,
      description: document.getElementById('input-desc').value.trim() || null,
    };

    var result = editingId
      ? await supabase.from('products').update(body).eq('id', editingId)
      : await supabase.from('products').insert(body);

    if (result.error) { showToast('Error: ' + result.error.message); return; }
    showToast(editingId ? 'Product updated.' : 'Product added.');
    await loadProductsList();

    if (editingId && viewingProduct) {
      Object.assign(viewingProduct, body);
      openDetailPanel(viewingProduct);
    } else {
      closePanel();
    }
  }

  async function deleteProductById(id) {
    if (!confirm('Delete this product? This cannot be undone.')) return;
    closeAllSwipes();
    var result = await supabase.from('products').delete().eq('id', id);
    if (result.error) { showToast('Error: ' + result.error.message); return; }
    showToast('Product deleted.');
    if (viewingProduct && viewingProduct.id === id) { closePanel(); viewingProduct = null; }
    await loadProductsList();
  }

  // ─── Combo ─────────────────────────────────────────────────────────
  // Each combo key tracks: { value, inputEl, listEl, fieldEl }
  var combos = {};

  function ensureCombos() {
    buildCombo('category', 'Select or type category…');
    buildCombo('unit',     'Select or type unit…');
  }

  function buildCombo(key, placeholder) {
    var container = document.getElementById('combo-' + key);
    if (!container) return;

    // Only build once; just refresh list if already built
    if (combos[key]) { refreshCombo(key); return; }

    container.innerHTML =
      '<div class="combo-wrap" id="combowrap-' + key + '">' +
        '<div class="combo-field" id="combofield-' + key + '">' +
          '<input class="combo-input" id="comboinput-' + key + '" type="text" autocomplete="off" placeholder="' + escHtml(placeholder) + '" />' +
          '<span class="combo-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>' +
        '</div>' +
        '<div class="combo-list" id="combolist-' + key + '"></div>' +
      '</div>';

    var inputEl = document.getElementById('comboinput-' + key);
    var listEl  = document.getElementById('combolist-'  + key);
    var fieldEl = document.getElementById('combofield-' + key);

    combos[key] = { value: '', inputEl: inputEl, listEl: listEl, fieldEl: fieldEl };

    // Open on focus / click
    inputEl.addEventListener('focus', function () { openCombo(key); });
    fieldEl.addEventListener('mousedown', function (e) {
      if (e.target === fieldEl) { inputEl.focus(); }
    });

    // Filter as user types
    inputEl.addEventListener('input', function () {
      combos[key].value = ''; // clear committed value while typing
      renderComboList(key);
    });

    // Close on outside click — use capture so it fires before focus events on other elements
    document.addEventListener('mousedown', function (e) {
      var wrap = document.getElementById('combowrap-' + key);
      if (wrap && !wrap.contains(e.target)) {
        closeCombo(key);
      }
    }, true);
  }

  function openCombo(key) {
    var c = combos[key]; if (!c) return;
    c.listEl.classList.add('open');
    c.fieldEl.classList.add('open');
    renderComboList(key);
  }

  function closeCombo(key) {
    var c = combos[key]; if (!c) return;
    c.listEl.classList.remove('open');
    c.fieldEl.classList.remove('open');
    // If nothing was committed, revert input display to committed value
    if (!c.value) c.inputEl.value = '';
    else c.inputEl.value = c.value;
  }

  function getComboValue(key) {
    return combos[key] ? combos[key].value : '';
  }

  function setComboValue(key, val) {
    var c = combos[key]; if (!c) return;
    c.value = val || '';
    c.inputEl.value = val || '';
    closeCombo(key);
  }

  function refreshCombo(key) {
    var c = combos[key]; if (!c) return;
    if (c.listEl.classList.contains('open')) renderComboList(key);
  }

  function renderComboList(key) {
    var c = combos[key]; if (!c) return;
    var items   = (key === 'category' ? categories : units).map(function (x) { return x.name; });
    var query   = c.inputEl.value.trim();
    var queryLC = query.toLowerCase();

    var filtered = query
      ? items.filter(function (it) { return it.toLowerCase().indexOf(queryLC) !== -1; })
      : items.slice();

    var exactMatch = items.some(function (it) { return it.toLowerCase() === queryLC; });
    var showAdd    = query && !exactMatch;

    var html = '';

    if (showAdd) {
      html += '<div class="combo-add-row" id="comboadd-' + key + '">' +
        '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg>' +
        ' Add "' + escHtml(query) + '"' +
      '</div>';
    }

    if (!showAdd && filtered.length === 0) {
      html += '<div class="combo-empty">No options found.</div>';
    }

    filtered.forEach(function (it) {
      var isSelected = it === c.value;
      html +=
        '<div class="combo-item-wrap" data-val="' + escHtml(it) + '">' +
          '<div class="combo-item' + (isSelected ? ' selected-item' : '') + '">' + escHtml(it) + '</div>' +
          '<button class="combo-del-btn" type="button" tabindex="-1">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
            'Delete' +
          '</button>' +
        '</div>';
    });

    c.listEl.innerHTML = html;

    // "Add" button
    var addRow = c.listEl.querySelector('#comboadd-' + key);
    if (addRow) {
      addRow.addEventListener('mousedown', function (e) { e.preventDefault(); });
      addRow.addEventListener('click', function () { addComboOption(key, query); });
    }

    // Option rows: click to select, swipe to delete
    c.listEl.querySelectorAll('.combo-item-wrap').forEach(function (row) {
      var itemEl = row.querySelector('.combo-item');
      var delEl  = row.querySelector('.combo-del-btn');
      var val    = row.dataset.val;

      // Prevent list mousedown from blurring the input
      row.addEventListener('mousedown', function (e) { e.preventDefault(); });

      // Click label → select
      itemEl.addEventListener('click', function () {
        setComboValue(key, val);
      });

      // Delete button click
      delEl.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteComboOption(key, val);
      });

      // ── Swipe-to-delete (touch + mouse) ──
      var sX, sDragging = false;

      row.addEventListener('touchstart', function (e) {
        sX = e.touches[0].clientX; sDragging = false;
        // close other revealed rows in this list
        c.listEl.querySelectorAll('.combo-item-wrap.revealed').forEach(function (r) { if (r !== row) r.classList.remove('revealed'); });
      }, { passive: true });

      row.addEventListener('touchmove', function (e) {
        if (Math.abs(e.touches[0].clientX - sX) > 8) sDragging = true;
      }, { passive: true });

      row.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - sX;
        if (sDragging && dx < -40) { row.classList.add('revealed'); }
        else if (sDragging && dx > 20) { row.classList.remove('revealed'); }
      }, { passive: true });

      // Mouse swipe
      row.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        sX = e.clientX; sDragging = false; row._swipeMD = true;
        c.listEl.querySelectorAll('.combo-item-wrap.revealed').forEach(function (r) { if (r !== row) r.classList.remove('revealed'); });
      });
      document.addEventListener('mousemove', function (e) {
        if (!row._swipeMD) return;
        if (Math.abs(e.clientX - sX) > 8) sDragging = true;
      });
      document.addEventListener('mouseup', function (e) {
        if (!row._swipeMD) return;
        row._swipeMD = false;
        if (!sDragging) return;
        var dx = e.clientX - sX;
        if (dx < -40) { row.classList.add('revealed'); }
        else if (dx > 20) { row.classList.remove('revealed'); }
      });
    });
  }

  async function addComboOption(key, name) {
    var table = key === 'category' ? 'product_categories' : 'units';
    var res = await supabase.from(table).insert({ name: name });
    if (res.error) { showToast('Error: ' + res.error.message); return; }
    await loadMeta();            // reloads categories/units + calls refreshCombo
    setComboValue(key, name);
    showToast('"' + name + '" added.');
  }

  async function deleteComboOption(key, name) {
    if (!confirm('Delete "' + name + '" from ' + key + 's? This cannot be undone.')) return;
    var table = key === 'category' ? 'product_categories' : 'units';
    var res = await supabase.from(table).delete().eq('name', name);
    if (res.error) { showToast('Error: ' + res.error.message); return; }
    if (combos[key] && combos[key].value === name) setComboValue(key, '');
    await loadMeta();
    renderComboList(key);
    showToast('"' + name + '" deleted.');
  }

  // ─── Helpers ───────────────────────────────────────────────────────
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2800);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>
